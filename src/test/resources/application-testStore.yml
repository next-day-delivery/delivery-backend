spring:
  # DB 자동 설정을 다시 켭니다 (exclude를 적지 않음으로써 활성화)
  # gradle에 testImplementation 'com.h2database:h2' 추가
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 이 부분이 핵심입니다!
  liquibase:
    enabled: false

  # Redis는 여전히 필요 없으므로 여기서만 exclude 유지 가능
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
